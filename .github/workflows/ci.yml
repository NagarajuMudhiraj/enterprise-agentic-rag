name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q src main.py

      - name: Run test suite
        # The suite is hermetic: no network, no LLM keys, no shared state.
        run: python -m pytest -q

  image:
    name: Container build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: enterprise-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name rag-ci -p 8000:8000 \
            -e APP_ENV=production \
            -e API_KEYS=smoke-key:admin,engineer \
            -e STORAGE_DIR=/data \
            enterprise-rag:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/query \
            -H 'Content-Type: application/json' -d '{"query":"health probe"}')
          test "$code" = "401"
          docker logs rag-ci | tail -n 20
          docker rm -f rag-ci

# Local stack: the API only.
#
# The service keeps its vector, BM25 and graph indexes in-process, so no
# external datastore is needed (the previous qdrant/neo4j/opensearch/redis
# services were never contacted by the code). VECTOR_STORE_URI, GRAPH_STORE_URI,
# OPENSEARCH_URI and REDIS_URI in .env exist for the adapters that will use
# them; add those services here once they are wired up.

services:
  api:
    build: .
    image: enterprise-rag:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Development keeps anonymous access for local evaluation.
      # For production set APP_ENV=production and provide API_KEYS, e.g.
      #   API_KEYS="live-key-1:admin,engineer|live-key-2:public" docker compose up
      APP_ENV: ${APP_ENV:-development}
      API_KEYS: ${API_KEYS:-}
      STORAGE_DIR: /data
    volumes:
      - rag_data:/data
    restart: unless-stopped

volumes:
  rag_data:
